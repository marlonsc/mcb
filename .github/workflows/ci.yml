name: CI

# === SECTION: triggers (managed) ===
# Source: operator CI policy — integration push/PR = blocking CI only;
# main push/PR (non-draft) = blocking CI; draft and other branches = none.
"on":
  push:
    branches:
      - dev
      - develop
      - 0.12.0-dev
      - main
  pull_request:
    branches:
      - dev
      - develop
      - 0.12.0-dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]
# End SECTION: triggers

# Why: one active run per workflow and branch prevents obsolete CI from consuming runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === SECTION: ci job (managed) ===
  # Source: template + config:github_actions.*
  ci:
    name: ci
    # Only the checkout job needs repository contents.
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: Y
      # The credential helper installed below reads the token from the
      # environment of every later step, so it is a job-level value.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      # Codegen refreshes the declared provider baseline before comparison.
      # actions/checkout deliberately does not persist credentials, so install
      # the runner's scoped token through the GitHub CLI's Git credential owner.
      - name: Configure GitHub authentication
        run: gh auth setup-git

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: 2026.8.14
      - name: Restore testmon cache
        id: testmon-restore
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .testmondata
          key: testmon-v1-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ hashFiles('uv.lock', '**/uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            testmon-v1-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ hashFiles('uv.lock', '**/uv.lock') }}-
            testmon-v1-${{ runner.os }}-${{ runner.arch }}-py3.13-

      - name: setup (blocking)
        # Why (flext-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make setup

      - name: gen (blocking)
        # Why (flext-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        # Why (mcb-pin): the bootstrap falls back to the moving 0.12.0-dev
        # branch; a mid-run tip advance re-rendered the projections under the
        # PR twice. This commit's projections were rendered by the generator
        # at 4736493059705cca743dec59da112e46bdf51df9 — pin the bootstrap to
        # that OID so the conformance comparison is deterministic.
        run: CI=Y make gen WHAT=apply APPLY=Y FLEXT_INFRA_BOOTSTRAP_REQUIREMENT="flext-infra @ git+https://github.com/flext-sh/flext-infra.git@4736493059705cca743dec59da112e46bdf51df9"

      - name: fmt (blocking)
        # Why (flext-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make fmt WHAT=apply APPLY=Y

      - name: fix (blocking)
        # Why (flext-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make fix WHAT=apply APPLY=Y

      - name: check (blocking)
        # Why (flext-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make check

      # Why (aihub-v01jg): CI=Y runs ONE HALF of the gate set
      # (lint pyright security markdown smells); the complement
      # (pyrefly mypy) is owned by
      # CI=N and, without this step, ran on developer
      # machines only. That split let real defects reach main twice: five
      # missing-attribute errors and an inconsistent-inheritance error, each
      # green in CI and red locally. The two contexts are strict complements by
      # construction, so running both here costs one extra pass and closes the
      # hole rather than trusting everyone to run the other half by hand.
      - name: check complement (blocking)
        run: CI=N make check

      - name: Dump reports on failure
        if: ${{ failure() }}
        run: |
          set -eu
          # Structured reports only — same allowlist as Upload reports (no raw
          # pytest/tool logs: those may carry connection strings / env secrets).
          report_roots=()
          for candidate in .reports apps; do
            if [ -e "$candidate" ]; then report_roots+=("$candidate"); fi
          done
          if [ "${#report_roots[@]}" -gt 0 ]; then
            report_list="$(mktemp "${RUNNER_TEMP:?}/flext-ci-reports.XXXXXX")"
            find "${report_roots[@]}" \
              \( -path '*/junit.xml' -o -path '*/coverage.xml' -o -path '*/coverage.json' \) \
              -type f -print0 >"$report_list"
            while IFS= read -r -d '' f; do
              echo "::group::$f"
              tail -n 200 "$f"
              echo "::endgroup::"
            done <"$report_list"
          fi
      - name: Upload reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: flext-ci-reports-${{ github.run_id }}
          # Structured reports only — omit raw pytest/tool logs that may carry
          # connection strings or env-derived secrets from integration fixtures.
          path: |
            .reports/**/junit.xml
            .reports/**/coverage.xml
            .reports/**/coverage.json
            apps/*/.reports/**/junit.xml
            apps/*/.reports/**/coverage.xml
            apps/*/.reports/**/coverage.json
          if-no-files-found: ignore
          retention-days: 7
  # End SECTION: ci job

  # === SECTION: merge-guard job (managed) ===
  merge-guard:
    name: merge-guard
    # Always run on PRs so a WIP/DRAFT source cannot slip past the skipped CI job.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Block WIP/DRAFT merges into protected integration branches
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -eu
          case "$BASE_REF" in
            dev|develop|0.12.0-dev)
              ;;
            *)
              echo "Merge guard passed for $HEAD_REF -> $BASE_REF"
              exit 0
              ;;
          esac
          if [ "$IS_DRAFT" = "true" ]; then
            echo "DRAFT PR cannot merge into ${BASE_REF}"
            exit 1
          fi
          for pattern in '^wip/' 'WIP'; do
            if [[ "$HEAD_REF" =~ $pattern ]]; then
              echo "WIP branch ${HEAD_REF} cannot merge into ${BASE_REF}"
              exit 1
            fi
          done
          echo "Merge guard passed for $HEAD_REF -> $BASE_REF"
  # End SECTION: merge-guard job
