# Generated by `flext-infra codegen conform` for mcb-scripts — DO NOT EDIT.
name: Docs

"on":
  push:
    branches:
      - main
      - 0.12.0-dev
      - 0.20.0-dev
      - develop
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"

      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Why: GitHub-hosted runners share egress IPs, so the unauthenticated
    # 60 req/h REST budget is exhausted before mise resolves the moving
    # @latest backends (observed 2026-09-23: 403, rate limit 0/60, on every
    # backend in Sync workspace toolchain), and docs generation reads the
    # governed sibling repos. The job token authenticates both, as in CI.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      # Why: a cold runner re-downloaded every locked Mise tool
      # (go included) on every Docs run, and a network blip failed setup. The
      # cache is content-addressed by the committed locks, so a warm cache is
      # always valid for the same lock and can never hide a finding; it only
      # removes the cold download of the pinned tarballs.
      - name: Restore tool caches
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-3.13-tools-


      - name: Sync workspace toolchain
        run: make setup

      # Why: save on every outcome — including a failing gate — so the next run
      # starts warm. Only written when the restore missed.
      - name: Save tool caches
        if: ${{ always() && steps.tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml') }}


      - name: Generation drift (blocking)
        run: |
          make gen
          make verify-clean

      - name: Docs lifecycle (blocking)
        run: make docs

      # The preceding generation check cannot see changes made by make docs.
      - name: Verify docs byte-identical repository
        run: make verify-clean

      # Failure diagnostics execute only after the original Make step has
      # already propagated its exact status to Actions.
      - name: Dump docs reports on failure
        if: failure()
        run: |
          set -eu
          for report_root in .reports apps; do
            if [ -d "$report_root" ]; then
              find "$report_root" \
                \( -path '*/audit-summary.json' -o -path '*/audit-report.md' -o -path '*/validate-summary.json' -o -path '*/validate-report.md' \) \
                -type f -exec sh -eu -c '
                  for report_file do
                    printf "::group::%s\n" "$report_file"
                    tail -n 80 "$report_file"
                    printf "::endgroup::\n"
                  done
                ' sh {} +
            fi
          done

      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-reports
          # Structured docs reports only — omit raw docs log trees that may carry
          # env-derived secrets from setup/docs phases.
          path: |
            .reports/**/audit-summary.json
            .reports/**/audit-report.md
            .reports/**/validate-summary.json
            .reports/**/validate-report.md
            apps/*/.reports/**/audit-summary.json
            apps/*/.reports/**/audit-report.md
            apps/*/.reports/**/validate-summary.json
            apps/*/.reports/**/validate-report.md
          if-no-files-found: error
          # The allowlisted reports live under hidden .reports directories.
          # upload-artifact excludes hidden paths unless this is explicit.
          include-hidden-files: true
          retention-days: 7

  build:
    name: build
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Why: same authenticated toolchain and docs-source resolution as docs-quality.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      # Why: same cold-download protection as the docs-quality job.
      - name: Restore tool caches
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-3.13-tools-


      - name: Sync workspace toolchain
        run: make setup
      - name: Save tool caches
        if: ${{ always() && steps.tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml') }}


      - name: Build site
        run: make docs

      - name: Verify byte-identical repository
        run: make verify-clean

      # Pages configure/upload exist only to feed deploy on main. Running them on
      # every integration push fails closed when Pages is unset and is wasted
      # work when deploy is skipped (deploy already gates on refs/heads/main).
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .reports/docs/site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
