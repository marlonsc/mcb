# Generated by `flext-infra codegen conform` for mcb-scripts — DO NOT EDIT.
name: Docs

"on":
  push:
    branches:
      - main
      - develop
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"

      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Sync workspace toolchain
        run: make setup

      # mro-o6h5 (agent: kimi) — failure diagnostics: per-project logs live under
      # .reports/workspace/docs/*.log and were invisible in CI ("0 errors" FAILs);
      # dump them inline + per-project audit-report.md for non-zero issue counts +
      # upload as artifact so the real error is always reachable.
      - name: Docs audit (blocking)
        run: |
          make docs WHAT=audit || {
            while IFS= read -r -d '' f; do
              echo "::group::$f"
              tail -n 80 "$f"
              echo "::endgroup::"
            done < <(
              find .reports apps \
                \( -path '*/audit-summary.json' -o -path '*/audit-report.md' \
                   -o -path '*/validate-summary.json' -o -path '*/validate-report.md' \) \
                -type f -print0 2>/dev/null || true
            )
            exit 1
          }

      - name: Docs generate (materialize contract artifacts)
        run: make docs WHAT=generate APPLY=Y

      - name: Docs validate (blocking)
        run: |
          make docs WHAT=validate || {
            while IFS= read -r -d '' f; do
              echo "::group::$f"
              tail -n 80 "$f"
              echo "::endgroup::"
            done < <(
              find .reports apps \
                \( -path '*/validate-summary.json' -o -path '*/validate-report.md' \
                   -o -path '*/audit-summary.json' -o -path '*/audit-report.md' \) \
                -type f -print0 2>/dev/null || true
            )
            exit 1
          }

      # mro-o6h5 (agent: kimi) — include-hidden-files: .reports/ is a dot-dir and
      # upload-artifact v4 skips hidden paths by default (artifact silently empty).
      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docs-reports
          # Structured docs reports only — omit raw docs log trees that may carry
          # env-derived secrets from setup/docs phases.
          path: |
            .reports/**/audit-summary.json
            .reports/**/audit-report.md
            .reports/**/validate-summary.json
            .reports/**/validate-report.md
            apps/*/.reports/**/audit-summary.json
            apps/*/.reports/**/audit-report.md
            apps/*/.reports/**/validate-summary.json
            apps/*/.reports/**/validate-report.md
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Sync workspace toolchain
        run: make setup

      - name: Generate docs
        run: make docs WHAT=generate APPLY=Y

      - name: Build site
        run: make docs WHAT=build

      # Pages configure/upload exist only to feed deploy on main. Running them on
      # every integration push fails closed when Pages is unset and is wasted
      # work when deploy is skipped (deploy already gates on refs/heads/main).
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: .reports/docs/site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
