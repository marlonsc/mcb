# Generated by `flext-infra codegen conform` for mcb-scripts — DO NOT EDIT.
name: Docs

"on":
  push:
    branches:
      - dev
      - develop
      - 0.12.0-dev
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"

      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          version: 2026.8.14

      - name: Sync workspace toolchain
        run: make setup

      # flext-o6h5 (agent: kimi) — failure diagnostics: per-project logs live under
      # .reports/workspace/docs/*.log and were invisible in CI ("0 errors" FAILs);
      # dump them inline + per-project audit-report.md for non-zero issue counts +
      # upload as artifact so the real error is always reachable.
      - name: Docs audit (blocking)
        run: |
          set -euo pipefail
          if .venv/bin/python -m flext_infra docs audit --workspace . --output-dir .reports/docs; then
            :
          else
            command_status="$?"
            report_roots=()
            for candidate in .reports apps; do
              if [ -e "$candidate" ]; then report_roots+=("$candidate"); fi
            done
            if [ "${#report_roots[@]}" -gt 0 ]; then
              report_list="$(mktemp "${RUNNER_TEMP:?}/flext-docs-audit.XXXXXX")"
              find "${report_roots[@]}" \
                \( -path '*/audit-summary.json' -o -path '*/audit-report.md' \
                   -o -path '*/validate-summary.json' -o -path '*/validate-report.md' \) \
                -type f -print0 >"$report_list"
              while IFS= read -r -d '' f; do
                echo "::group::$f"
                tail -n 80 "$f"
                echo "::endgroup::"
              done <"$report_list"
            fi
            exit "$command_status"
          fi

      - name: Docs generate (materialize contract artifacts)
        run: .venv/bin/python -m flext_infra docs generate --workspace . --output-dir .reports/docs --apply

      - name: Docs validate (blocking)
        run: |
          set -euo pipefail
          if .venv/bin/python -m flext_infra docs validate --workspace . --output-dir .reports/docs; then
            :
          else
            command_status="$?"
            report_roots=()
            for candidate in .reports apps; do
              if [ -e "$candidate" ]; then report_roots+=("$candidate"); fi
            done
            if [ "${#report_roots[@]}" -gt 0 ]; then
              report_list="$(mktemp "${RUNNER_TEMP:?}/flext-docs-validate.XXXXXX")"
              find "${report_roots[@]}" \
                \( -path '*/validate-summary.json' -o -path '*/validate-report.md' \
                   -o -path '*/audit-summary.json' -o -path '*/audit-report.md' \) \
                -type f -print0 >"$report_list"
              while IFS= read -r -d '' f; do
                echo "::group::$f"
                tail -n 80 "$f"
                echo "::endgroup::"
              done <"$report_list"
            fi
            exit "$command_status"
          fi

      # flext-o6h5 (agent: kimi) — include-hidden-files: .reports/ is a dot-dir and
      # upload-artifact skips hidden paths by default (artifact silently empty).
      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docs-reports
          # Structured docs reports only — omit raw docs log trees that may carry
          # env-derived secrets from setup/docs phases.
          path: |
            .reports/**/audit-summary.json
            .reports/**/audit-report.md
            .reports/**/validate-summary.json
            .reports/**/validate-report.md
            apps/*/.reports/**/audit-summary.json
            apps/*/.reports/**/audit-report.md
            apps/*/.reports/**/validate-summary.json
            apps/*/.reports/**/validate-report.md
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          version: 2026.8.14

      - name: Sync workspace toolchain
        run: make setup

      - name: Generate docs
        run: .venv/bin/python -m flext_infra docs generate --workspace . --output-dir .reports/docs --apply

      - name: Build site
        run: .venv/bin/python -m flext_infra docs build --workspace . --output-dir .reports/docs

      # Pages configure/upload exist only to feed deploy on main. Running them on
      # every integration push fails closed when Pages is unset and is wasted
      # work when deploy is skipped (deploy already gates on refs/heads/main).
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: .reports/docs/site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: ${{ 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
