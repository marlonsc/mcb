name: Docs

"on":
  push:
    branches:
      - dev
      - develop
      - 0.12.0-dev
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"

      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Install mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3
        with:
          version: 2026.8.14

      - name: Sync workspace toolchain
        run: make setup

      - name: Generation drift (blocking)
        run: make gen WHAT=check

      - name: Docs audit (blocking)
        run: make docs WHAT=audit

      - name: Docs validate (blocking)
        run: make docs WHAT=validate

      # Failure diagnostics execute only after the original Make step has
      # already propagated its exact status to Actions.
      - name: Dump docs reports on failure
        if: failure()
        run: |
          set -eu
          for report_root in .reports apps; do
            if [ -d "$report_root" ]; then
              find "$report_root" \
                \( -path '*/audit-summary.json' -o -path '*/audit-report.md' \
                   -o -path '*/validate-summary.json' -o -path '*/validate-report.md' \) \
                -type f -exec sh -eu -c '
                  for report_file do
                    printf "::group::%s\n" "$report_file"
                    tail -n 80 "$report_file"
                    printf "::endgroup::\n"
                  done
                ' sh {} +
            fi
          done

      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-reports
          # Structured docs reports only — omit raw docs log trees that may carry
          # env-derived secrets from setup/docs phases.
          path: |
            .reports/**/audit-summary.json
            .reports/**/audit-report.md
            .reports/**/validate-summary.json
            .reports/**/validate-report.md
            apps/*/.reports/**/audit-summary.json
            apps/*/.reports/**/audit-report.md
            apps/*/.reports/**/validate-summary.json
            apps/*/.reports/**/validate-report.md
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Install mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3
        with:
          version: 2026.8.14

      - name: Sync workspace toolchain
        run: make setup

      - name: Build site
        run: make docs WHAT=build

      - name: Verify byte-identical repository
        run: |
          git diff --exit-code -- .
          git diff --cached --exit-code -- .

      # Pages configure/upload exist only to feed deploy on main. Running them on
      # every integration push fails closed when Pages is unset and is wasted
      # work when deploy is skipped (deploy already gates on refs/heads/main).
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: .reports/docs/site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: ${{ 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
