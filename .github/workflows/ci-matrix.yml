# Source: template (base/.github/workflows/ci-matrix.yml.j2)
# Free: no
# End SECTION: header
# Multi-environment CI base: proves the project bootstrap and canonical Make
# verbs work identically across distros, macOS, and Windows. The CI invokes
# the project's own Make surface; it never reimplements bootstrap.
# Projected only for workspace-root/standalone. Auto-run is opt-in via
# repository_policy_overlays.ci_matrix_auto_run (default false = workflow_dispatch
# only). When enabled, also push to main. Workspace members are covered by the
# root matrix; conform/make gen WHAT=apply APPLY=Y prunes orphan member copies.
# Never bind triggers to the integration-line variable.
---
name: ci-matrix

# === SECTION: triggers (managed) ===
# Source: overlay ci_matrix_auto_run (default dispatch-only; no pull_request;
# no integration-line binding)
"on":
  workflow_dispatch: {}
# End SECTION: triggers



# === SECTION: permissions (managed) ===
# Source: template (minimal read-only permissions)
permissions:
  contents: read
# End SECTION: permissions

# === SECTION: concurrency (managed) ===
# Source: template (one run per workflow+ref)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# End SECTION: concurrency

jobs:
  # === SECTION: distro-matrix (managed) ===
  # Source: template + config:github_actions.checkout (distro list is template literal by design)
  distro-matrix:
    # Clean-machine proof per distro: build the distro image (which runs the
    # full project bootstrap at image-build time), then smoke the verb surface
    # inside the built container.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora, alpine, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          # No step needs authenticated git after checkout; persisting the
          # token into .git/config would expose it to every later command.
          persist-credentials: false
      - name: Build ${{ matrix.distro }} image
        run: >-
          docker build
          -f tests/fixtures/ci/docker/${{ matrix.distro }}.Dockerfile
          -t ci-matrix-${{ matrix.distro }}
          .
      - name: Bootstrap + verb smoke (${{ matrix.distro }})
        env:
          CI: Y
        run: |
          docker run --rm -e CI=Y ci-matrix-${{ matrix.distro }} make help
          docker run --rm -e CI=Y ci-matrix-${{ matrix.distro }} make check
          # ci-matrix proves bootstrap + check across distros; it never runs make test.
  # End SECTION: distro-matrix

  # === SECTION: macos (managed) ===
  # Source: template + config:github_actions.checkout/setup-python/mise/setup-uv
  macos:
    runs-on: macos-latest
    env:
      CI: Y
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          # No step needs authenticated git after checkout; persisting the
          # token into .git/config would expose it to every later command.
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install mise toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Bootstrap
        run: CI=Y make setup
      - name: Verb surface
        run: CI=Y make help
      # The canonical gate, not just the verb surface: this matrix exists to
      # catch platform-specific failures, and `make help` exercises none of
      # the gates. The linux job already runs it.
      - name: Canonical check
        run: CI=Y make check
  # End SECTION: macos

  # === SECTION: windows (managed) ===
  # Source: template + config:github_actions.checkout/setup-python/mise/setup-uv
  windows:
    runs-on: windows-latest
    env:
      CI: Y
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          # No step needs authenticated git after checkout; persisting the
          # token into .git/config would expose it to every later command.
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install mise toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Bootstrap
        shell: bash
        run: CI=Y make setup
      - name: Verb surface
        shell: bash
        run: CI=Y make help
      # The canonical gate, not just the verb surface: this matrix exists to
      # catch platform-specific failures, and `make help` exercises none of
      # the gates. The linux job already runs it.
      - name: Canonical check
        shell: bash
        run: CI=Y make check
  # End SECTION: windows
