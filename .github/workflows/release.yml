# Generated by `flext-infra codegen conform` for mcb-scripts — DO NOT EDIT.
name: Workspace Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.10.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  identity:
    name: Validate release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$REF_NAME"
          fi
          # Accept final and PEP 440 pre/dev/post releases:
          # v1.2.3, v1.2.3-dev, v1.2.3rc0, v1.2.3a1, v1.2.3b2,
          # v1.2.3.dev0, v1.2.3.post1
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev|((a|b|rc)[0-9]+)?(\.(dev|post)[0-9]+)?)$ ]]; then
            echo "Invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH with optional -dev or PEP 440 pre/dev/post suffix)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    name: Build standard workspace release
    needs: identity
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write # Create the GitHub release and push its release branch.
      pull-requests: write # Open the operator-reviewed release pull request.
    env:
      FLEXT_USE_HTTPS: "1"
      FLEXT_WORKSPACE_ROOT: ${{ github.workspace }}
      RELEASE_EVENT_NAME: ${{ github.event_name }}
      RELEASE_ROOT_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false

      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          ROOT_OID="$(git rev-parse HEAD)"
          if [ "$ROOT_OID" != "$RELEASE_ROOT_SHA" ]; then
            echo "checked-out root commit $ROOT_OID does not match event commit $RELEASE_ROOT_SHA" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            TAG_OID="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$TAG_OID" != "$ROOT_OID" ]; then
              echo "release tag $RELEASE_TAG resolves to $TAG_OID, not $ROOT_OID" >&2
              exit 1
            fi
          elif [ "$RELEASE_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "tag-triggered release is missing local tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          version: 2026.8.14

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev

      - name: Boot workspace
        run: make setup

      - name: Run release pipeline
        shell: bash
        run: |
          set -euo pipefail
          make release WHAT=rel APPLY=Y \
            RELEASE_PHASE="validate,version,build,publish" \
            VERSION="$RELEASE_VERSION" \
            TAG="$RELEASE_TAG" \
            INTERACTIVE=0 \
            CREATE_BRANCHES=0 \
            PUSH=0

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=".reports/release/${RELEASE_TAG}/RELEASE_NOTES.md"
          REPORT=".reports/release/v${RELEASE_VERSION}/build-report.json"
          shopt -s nullglob
          ARTIFACTS=(.reports/release/v"${RELEASE_VERSION}"/artifacts/*/*)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$NOTES"
            gh release upload "$RELEASE_TAG" "$REPORT" "${ARTIFACTS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$REPORT" \
              "${ARTIFACTS[@]}" \
              --title "Release $RELEASE_TAG" \
              --notes-file "$NOTES"
          fi

      - name: Open or update release PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="release/${RELEASE_VERSION}-sync"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          git fetch origin main --tags
          if git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "tag $RELEASE_TAG already reachable from main"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git switch --create "$BRANCH" --track "origin/$BRANCH"
          else
            git switch --create "$BRANCH" "$RELEASE_TAG"
          fi
          CHANGELOG_PATHS=()
          for path in docs/CHANGELOG.md docs/releases/latest.md "docs/releases/${RELEASE_TAG}.md"; do
            [ -e "$path" ] && CHANGELOG_PATHS+=("$path")
          done
          if [ "${#CHANGELOG_PATHS[@]}" -gt 0 ]; then
            git add -- "${CHANGELOG_PATHS[@]}"
            if ! git diff --cached --quiet; then
              git commit -m "docs: close changelog for ${RELEASE_TAG}"
            fi
          fi

          git push --set-upstream origin "$BRANCH"

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            PR_URL="$(gh pr view "$BRANCH" --json url --jq .url)"
          else
            PR_BODY="$(printf 'Automated release merge for %s.\n\n- release: %s\n- version: %s\n- status: alpha, non-production\n' \
              "$RELEASE_TAG" "$RELEASE_TAG" "$RELEASE_VERSION")"
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "release: ${RELEASE_TAG}" --body "$PR_BODY")"
          fi

          echo "release PR ready for operator review: $PR_URL"

  testpypi:
    name: Publish flext-core canary to TestPyPI
    needs: identity
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # Authenticate to TestPyPI through trusted publishing.
    environment: testpypi
    env:
      FLEXT_USE_HTTPS: "1"
      FLEXT_WORKSPACE_ROOT: ${{ github.workspace }}
      RELEASE_ROOT_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - name: Checkout immutable canary source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false

      - name: Verify immutable canary root
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ROOT_OID="$(git rev-parse HEAD)"
          if [ "$ROOT_OID" != "$RELEASE_ROOT_SHA" ]; then
            echo "checked-out root commit $ROOT_OID does not match event commit $RELEASE_ROOT_SHA" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_OID="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$TAG_OID" != "$ROOT_OID" ]; then
            echo "canary tag $RELEASE_TAG resolves to $TAG_OID, not $ROOT_OID" >&2
            exit 1
          fi
          CORE_OID="$(git rev-parse "${RELEASE_ROOT_SHA}:flext-core")"
          echo "core_oid=$CORE_OID" >> "$GITHUB_OUTPUT"

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          version: 2026.8.14

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev

      - name: Boot workspace
        run: make setup PROJECT=flext-core

      - name: Verify immutable flext-core gitlink
        shell: bash
        run: |
          set -euo pipefail
          CORE_OID="${{ steps.source.outputs.core_oid }}"
          CHECKED_CORE_OID="$(git -C flext-core rev-parse HEAD)"
          if [ "$CHECKED_CORE_OID" != "$CORE_OID" ]; then
            echo "checked-out flext-core commit $CHECKED_CORE_OID does not match gitlink $CORE_OID" >&2
            exit 1
          fi

      - name: Build flext-core canary
        shell: bash
        run: |
          set -euo pipefail
          make release WHAT=rel APPLY=Y \
            PROJECT=flext-core \
            RELEASE_PHASE="validate,build" \
            VERSION="$RELEASE_VERSION" \
            TAG="$RELEASE_TAG" \
            INTERACTIVE=0 \
            CREATE_BRANCHES=0 \
            PUSH=0

      - name: Publish verified flext-core canary to TestPyPI
        env:
          EXPECTED_CORE_OID: ${{ steps.source.outputs.core_oid }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT=".reports/release/v${RELEASE_VERSION}/build-report.json"
          ARTIFACT_DIR="$(realpath ".reports/release/v${RELEASE_VERSION}/artifacts/flext-core")"
          PROJECT_PATH="$(realpath flext-core)"
          jq -e \
            --arg commit_oid "$EXPECTED_CORE_OID" \
            --arg project_path "$PROJECT_PATH" \
            --arg version "$RELEASE_VERSION" '
              .version == $version and
              .dry_run == false and
              .total == 1 and
              .failures == 0 and
              (.records | length) == 1 and
              (.records[0] |
                .project == "flext-core" and
                .path == $project_path and
                .exit_code == 0 and
                .commit_oid == $commit_oid and
                (.source_date_epoch | type) == "number" and
                (.source_license_sha256 | type) == "string" and
                (.source_license_sha256 | test("^[0-9a-f]{64}$")) and
                (.artifacts | length) == 2 and
                ([.artifacts[].kind] | sort) == ["sdist", "wheel"] and
                all(.artifacts[];
                  (.path | type) == "string" and
                  (.sha256 | type) == "string" and
                  (.sha256 | test("^[0-9a-f]{64}$"))))
            ' "$REPORT" >/dev/null

          mapfile -t ARTIFACT_ROWS < <(
            jq -r '.records[0].artifacts[] | @base64' "$REPORT"
          )
          ARTIFACTS=()
          for ROW in "${ARTIFACT_ROWS[@]}"; do
            ARTIFACT_JSON="$(printf '%s' "$ROW" | base64 --decode)"
            ARTIFACT_KIND="$(jq -er '.kind' <<< "$ARTIFACT_JSON")"
            ARTIFACT_PATH="$(jq -er '.path' <<< "$ARTIFACT_JSON")"
            EXPECTED_SHA256="$(jq -er '.sha256' <<< "$ARTIFACT_JSON")"
            if [ ! -f "$ARTIFACT_PATH" ] || [ -L "$ARTIFACT_PATH" ]; then
              echo "reported artifact is not a regular non-symlink file: $ARTIFACT_PATH" >&2
              exit 1
            fi
            RESOLVED_PATH="$(realpath "$ARTIFACT_PATH")"
            EXPECTED_PATH="$ARTIFACT_DIR/$(basename "$ARTIFACT_PATH")"
            if [ "$RESOLVED_PATH" != "$EXPECTED_PATH" ]; then
              echo "reported artifact escapes flext-core artifact directory: $RESOLVED_PATH" >&2
              exit 1
            fi
            case "$ARTIFACT_KIND:$RESOLVED_PATH" in
              wheel:*.whl | sdist:*.tar.gz) ;;
              *)
                echo "reported artifact kind does not match path: $ARTIFACT_KIND $RESOLVED_PATH" >&2
                exit 1
                ;;
            esac
            ACTUAL_SHA256="$(sha256sum "$RESOLVED_PATH" | cut -d ' ' -f 1)"
            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "artifact SHA-256 mismatch: $RESOLVED_PATH" >&2
              exit 1
            fi
            ARTIFACTS+=("$RESOLVED_PATH")
          done
          if [ "${#ARTIFACTS[@]}" -ne 2 ]; then
            echo "expected exactly one verified flext-core wheel and one sdist" >&2
            exit 1
          fi
          uv publish \
            --no-config \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/ \
            --trusted-publishing always \
            "${ARTIFACTS[@]}"

