---
# =============================================================================
# Release Workflow
# =============================================================================
# Builds release binaries for Linux, macOS, Windows
# Creates GitHub Release with artifacts and changelog
# =============================================================================

name: Release

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag authorized for publication (e.g. v0.3.2)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publication-gate:
    name: Canonical Publication Gate
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
          submodules: recursive
      - run: bash .github/setup-ci.sh
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify authorized tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: '$RELEASE_TAG' is not a supported version tag." >&2
            exit 1
          fi
          if [[ "$(git describe --tags --exact-match)" != "$RELEASE_TAG" ]]; then
            echo "ERROR: checkout does not resolve exactly to '$RELEASE_TAG'." >&2
            exit 1
          fi
      - name: Run canonical publication gate
        run: make ship WHAT=release ACT=package APPLY=Y

  release-build:
    name: Build Release (${{ matrix.target }})
    timeout-minutes: 30
    needs: publication-gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: mcb
            asset_name: mcb-x86_64-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: mcb
            asset_name: mcb-x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mcb.exe
            asset_name: mcb-x86_64-windows.exe
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: bash .github/setup-ci.sh

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PROTOC_VERSION: "29.3"
          PROTOC_SHA256: "57ea59e9f551ad8d71ffaa9b5cfbe0ca1f4e720972a1db7ec2d12ab44bff9383"
        run: |
          $base = "https://github.com/protocolbuffers/protobuf/releases/download"
          $url = "$base/v${env:PROTOC_VERSION}/protoc-${env:PROTOC_VERSION}-win64.zip"
          $zip = "$env:TEMP\protoc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -ErrorAction Stop
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:PROTOC_SHA256) {
            throw "protoc checksum mismatch: expected $($env:PROTOC_SHA256), got $hash"
          }
          Expand-Archive $zip -DestinationPath "$env:TEMP\protoc" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:TEMP\protoc\bin"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: make build RELEASE=1

      - name: Create dist directory (Unix)
        if: runner.os != 'Windows'
        run: mkdir -p dist

      - name: Create dist directory (Windows)
        if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Force -Path dist
        shell: pwsh

      - name: Copy artifact (Unix)
        if: runner.os != 'Windows'
        env:
          ARTIFACT: ${{ matrix.artifact_name }}
          ASSET: ${{ matrix.asset_name }}
        run: cp "target/release/$ARTIFACT" "dist/$ASSET"

      - name: Copy artifact (Windows)
        if: runner.os == 'Windows'
        run: >-
          Copy-Item "target\release\${{ matrix.artifact_name }}"
          "dist\${{ matrix.asset_name }}"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 7
          include-hidden-files: false

  create-release:
    name: Create GitHub Release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Extract version from tag
        id: extract_version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          VERSION=${TAG#v}
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        env:
          RELEASE_TAG: ${{ steps.extract_version.outputs.tag }}
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"

          # Extract version section from CHANGELOG.md (preferred)
          if [ -f "docs/operations/CHANGELOG.md" ]; then
            sed -n "/^## \\[$VERSION\\]/,/^## \\[/p" docs/operations/CHANGELOG.md | sed '$d' > RELEASE_NOTES.md
          fi

          # Fallback to git log if CHANGELOG section not found or empty
          if [ ! -s RELEASE_NOTES.md ]; then
            PREV_TAG=$(
              git tag --list 'v*' --sort=-version:refname |
              grep -v "^${RELEASE_TAG}$" |
              head -1
            )
            if [ -z "$PREV_TAG" ]; then
              git log --oneline --reverse "$RELEASE_TAG" > RELEASE_NOTES.md
            else
              git log "$PREV_TAG..$RELEASE_TAG" --oneline > RELEASE_NOTES.md
            fi
            sed -i '1s/^/## Changes\n\n/' RELEASE_NOTES.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.extract_version.outputs.tag }}
          name: Release ${{ steps.extract_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/release-artifacts-x86_64-unknown-linux-gnu/mcb-x86_64-linux-gnu
            release-artifacts/release-artifacts-x86_64-apple-darwin/mcb-x86_64-macos
            release-artifacts/release-artifacts-x86_64-pc-windows-msvc/mcb-x86_64-windows.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Release Summary
        env:
          RELEASE_TAG: ${{ steps.extract_version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Release Created"
            echo ""
            echo "[OK] Release $RELEASE_TAG created successfully"
            echo ""
            echo "**Artifacts:**"
            echo "- Linux (x86_64-unknown-linux-gnu)"
            echo "- macOS (x86_64-apple-darwin)"
            echo "- Windows (x86_64-pc-windows-msvc)"
            echo ""
            echo "**URL:**"
            echo "https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Documentation Build + Deploy
  # ===========================================================================

  docs:
    name: Build & Deploy Documentation
    needs: [publication-gate, release-build]
    uses: ./.github/workflows/docs-build.yml
    with:
      deploy: true
      validate: true
    permissions:
      contents: write
