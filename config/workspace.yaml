# Handwritten topology SSOT consumed by `flext-infra codegen conform`.
# conform never overwrites this input. Declare members/exclusions here, then
# run `make gen WHAT=apply APPLY=Y`.
version: 3
name: mcb-scripts
# Why (mro-5j8p): short issue-prefix (bd max 20 chars) + Dolt-safe ledger_id.
ledger_prefix: mcb
ledger_id: mcb
repository:
  name: mcb-scripts
  distribution: mcb-scripts
  provider: marlonsc
  url: https://github.com/marlonsc/mcb.git
  path: .
  role: standalone
  state: active
  checkout: independent
  codegen: conform
  # The shared Python library lives at src/mcb_scripts/, so this repository IS
  # a package. (This flag does not feed analyzer-root ordering.)
  package: true
  # The test suite and the scripts/ command tree import mcb_scripts.*, so the
  # package must be installed into the runtime venv, not merely present on disk.
  editable: true
  read_only: false
  # mcb owns two Python roots: the library at src/mcb_scripts/ and the command
  # tree at scripts/<verb>/<what>, executed by scripts/dispatch.py. Declaring
  # the dispatch seam is what makes the generated Makefile append
  # $(PROJECT_ROOT)/scripts to RUFF_PATHS/MYPY_PATHS, so the official ruff and
  # mypy gates reach the command tree instead of only the library.
  script_dispatch:
    dispatcher: scripts/dispatch.py
    roots:
      - scripts
  # Project-owned public verbs are DISCOVERED from scripts/<verb>/all.sh (the
  # filesystem is the SSOT; no manual verb list is declared here). Surfaces:
  #   rust(all|lint|unit|integration|doc|golden|test), validate(quick|full),
  #   guard(all), gitops(all). The old `audit` selector is covered by the
  # canonical `audit` verb at this generator revision.
project:
  package_name: "mcb_scripts"
  class_stem: "McbScripts"
  namespace: "McbScripts"
  constant_name: "mcb"
  namespace_attribute: "mcb_scripts"
  alias: "mcb_scripts"
  environment_prefix: "MCB_"
  description: "Repository-local automation helpers for MCB"
  license: "MIT"
  author_name: "Marlon Costa"
  author_email: "marlonsc@gmail.com"
  upstream: "flext_cli"
  homepage: "https://github.com/marlonsc/mcb"
  documentation: "https://github.com/marlonsc/mcb"
  repository_root_rel: "."
  year: 2026
members: []
exclusions:
  # Synthetic sample codebase consumed by validator integration tests as
  # plain data. It is not a generation participant: its layout is fixture
  # shape, not governed projection, so the shared project discovery must not
  # plan lazy-init or transaction participants inside it.
  - path: tests/fixtures/test_repo
    reason: "sample codebase fixture for mcb-validate integration tests; not a generation participant"
integration:
  provider: marlonsc
  branch: develop
repository_policy_overlays:
  - project: mcb-scripts
    beads_enabled: true
    ci_enabled: true
