# Project-owned managed-artifact additions loaded as one typed configuration
# snapshot by flext-infra and injected into generation and dependency phases.
#
# Why this file exists: conform owns `[tool.ruff.lint.per-file-ignores]` in
# pyproject.toml and deletes every pattern absent from the composed canonical
# set, so an entry written straight into pyproject.toml is removed on the next
# `make gen`. The generator composes these rules with shared policy without
# publishing MCB-specific exemptions to other repositories.
#
# Why `scripts/**`: this tree holds repository-local automation helpers, not
# shipped library code. Its CLI entrypoints print to stdout and use `os.path`;
# the `sys.path` bootstrap they need forces module-level imports to follow
# executable code. Child processes still use the public process owner.
#
# Why `Gitignore.patterns`: `.gitignore` is a generated projection and the
# generator renders project-owned rules only from this surface (the
# "Project ignore patterns" section). PR #178 merged 619 files of machine
# config and session residue into develop as if they were source; PR #201
# removed them and declared these rules as the barrier against a repeat.
ManagedArtifacts:
  Ruff:
    per_file_ignores:
      # MCB repository automation only; keep subprocess execution governed by
      # the public process owner. These additions do not reach other projects.
      scripts/**: [any-type, unused-function-argument, undocumented-public-class, undocumented-public-method, undocumented-public-function, undocumented-public-init, unnecessary-multiline-docstring, blank-line-after-function, missing-blank-line-after-summary, multi-line-summary-first-line, raw-string-in-exception, f-string-in-exception, commented-out-code, shebang-not-executable, boolean-type-hint-positional-argument, boolean-default-value-positional-argument, read-whole-file, write-whole-file, if-exp-instead-of-or-operator, repeated-append, logging-string-concat, non-lowercase-variable-in-function, invalid-module-name, manual-list-comprehension, manual-list-copy, multiple-starts-ends-with, missing-maxsplit-arg, import-private-name, magic-value-comparison, literal-membership, unspecified-encoding, os-path-abspath, os-path-exists, os-path-join, os-path-dirname, builtin-open, path-constructor-current-directory, avoidable-escaped-quote, unsorted-dunder-all, used-dummy-variable, unused-noqa, noqa-comments, print, runtime-cast-value, banned-api, relative-imports, raise-vanilla-args, error-instead-of-exception, verbose-raise]
      "**/tests/python/**": [raise-vanilla-args]
  Gitignore:
    patterns:
      # Recovery archive written by the archive-not-delete rule. It preserves
      # superseded files so a removal stays reversible; it is never source, and
      # versioning it would resurrect exactly what the removal took out.
      - "/.archive/"
      # Machine-local build/editor configuration. These encode one workstation
      # (linker, job counts, cache sizes, editor state) and break every other
      # environment when versioned. The leading slash anchors each rule to the
      # repository root, so test fixtures that legitimately ship their own
      # .cargo/ or editor files stay tracked.
      - "/.cargo/"
      - "/.vscode/"
      - "/.waza.yaml"
      - "/opencode.jsonc"
      # Tool output. A report is produced by a gate, never authored; regenerate
      # it with the owning make verb instead of committing a snapshot.
      - "*.sarif"
      - "*violations*.txt"
      - "build_err.txt"
      - "clippy_output.txt"
      - "validate_output.txt"
      - "test_003_warnings.txt"
      - "staged_files.txt"
      - "pr[0-9]*_comments.txt"
      - "coverage/"
      # Compiled and captured test artifacts.
      - "*.rlib"
      - "/data/vectors/"
      - "/crates/mcb-providers/src/database/sqlite/test_file.txt"
      # Captured runtime logs. tests/mcb.<date> is server stdout, not a test.
      - "tests/mcb.[0-9]*"
      # Agent and session scratch.
      - "tmp_*.txt"
      - ".beads.gate.lock"
      # Parallel documentation tree. docs/ is the single documentation owner;
      # context/ duplicated it and described dill and figment, both removed by
      # ADR-050 and ADR-051.
      - "/context/"
      - "/.zcode/"
