# Project-owned managed-artifact additions consumed by
# `flext_infra.deps.phases.ensure_ruff` (`_project_per_file_ignores`).
#
# Why this file exists: conform owns `[tool.ruff.lint.per-file-ignores]` in
# pyproject.toml and deletes every pattern absent from the composed canonical
# set, so an entry written straight into pyproject.toml is removed on the next
# `make gen`. This is the sanctioned extension surface; the generator unions
# these rules with global policy.
#
# Why `scripts/**`: this tree holds repository-local automation helpers, not
# shipped library code. Its CLI entrypoints print to stdout, drive subprocesses,
# and use `os.path`; the `sys.path` bootstrap they need forces module-level
# imports to follow executable code.
#
# Why `Gitignore.patterns`: `.gitignore` is a generated projection and the
# generator renders project-owned rules only from this surface (the
# "Project ignore patterns" section). PR #178 merged 619 files of machine
# config and session residue into develop as if they were source; PR #201
# removed them and declared these rules as the barrier against a repeat.
ManagedArtifacts:
  Gitignore:
    patterns:
      # Recovery archive written by the archive-not-delete rule. It preserves
      # superseded files so a removal stays reversible; it is never source, and
      # versioning it would resurrect exactly what the removal took out.
      - "/.archive/"
      # Machine-local build/editor configuration. These encode one workstation
      # (linker, job counts, cache sizes, editor state) and break every other
      # environment when versioned. The leading slash anchors each rule to the
      # repository root, so test fixtures that legitimately ship their own
      # .cargo/ or editor files stay tracked.
      - "/.cargo/"
      - "/.vscode/"
      - "/.waza.yaml"
      - "/opencode.jsonc"
      # Tool output. A report is produced by a gate, never authored; regenerate
      # it with the owning make verb instead of committing a snapshot.
      - "*.sarif"
      - "*violations*.txt"
      - "build_err.txt"
      - "clippy_output.txt"
      - "validate_output.txt"
      - "test_003_warnings.txt"
      - "staged_files.txt"
      - "pr[0-9]*_comments.txt"
      - "coverage/"
      # Compiled and captured test artifacts.
      - "*.rlib"
      - "/data/vectors/"
      - "/crates/mcb-providers/src/database/sqlite/test_file.txt"
      # Captured runtime logs. tests/mcb.<date> is server stdout, not a test.
      - "tests/mcb.[0-9]*"
      # Agent and session scratch.
      - "tmp_*.txt"
      - ".beads.gate.lock"
      # Parallel documentation tree. docs/ is the single documentation owner;
      # context/ duplicated it and described dill and figment, both removed by
      # ADR-050 and ADR-051.
      - "/context/"
      - "/.zcode/"
