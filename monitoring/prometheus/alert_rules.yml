# MCP Context Browser Alert Rules
# Prometheus alerting rules for production monitoring

groups:
  # Service Health Alerts
  - name: mcp_service_health
    rules:
      - alert: McpServiceDown
        expr: up{job="mcb"} == 0
        for: 5m
        labels:
          severity: critical
          service: mcb
        annotations:
          summary: "MCP Context Browser service is down"
          description: "MCP Context Browser has been down for more than 5 minutes."

      - alert: McpHighErrorRate
        expr: rate(mcb_http_requests_total{status=~"5.."}[5m]) / rate(mcb_http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          service: mcb
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | printf \"%.2f\" }}% over the last 5 minutes."

      - alert: McpHighLatency
        expr: histogram_quantile(0.95, rate(mcb_http_request_duration_seconds_bucket[5m])) > 2.0
        for: 10m
        labels:
          severity: warning
          service: mcb
        annotations:
          summary: "High request latency detected"
          description: "95th percentile latency is {{ $value | printf \"%.2f\" }}s over the last 5 minutes."

  # SLO-based Alerts
  - name: mcp_slo_alerts
    rules:
      # 99.9% uptime SLO (8.77 hours downtime per year allowed)
      - alert: McpUptimeSLOViolation
        expr: (1 - (avg_over_time(up{job="mcb"}[30d]))) > 0.001
        labels:
          severity: critical
          service: mcb
          slo: uptime
        annotations:
          summary: "Uptime SLO violation"
          description: "Service uptime over 30 days: {{ $value | printf \"%.4f\" }}% (SLO: 99.9%)."

      # Query latency SLO (< 500ms P95)
      - alert: McpLatencySLOViolation
        expr: histogram_quantile(0.95, rate(mcb_http_request_duration_seconds_bucket{path="/mcp"}[30d])) > 0.5
        labels:
          severity: warning
          service: mcb
          slo: latency
        annotations:
          summary: "Query latency SLO violation"
          description: "Search endpoint P95 latency: {{ $value | printf \"%.3f\" }}s (SLO: < 500ms)."

      # Error rate SLO (< 0.1% errors)
      - alert: McpErrorRateSLOViolation
        expr: rate(mcb_http_requests_total{status=~"5.."}[30d]) / rate(mcb_http_requests_total[30d]) > 0.001
        labels:
          severity: warning
          service: mcb
          slo: error_rate
        annotations:
          summary: "Error rate SLO violation"
          description: "Error rate over 30 days: {{ $value | printf \"%.4f\" }}% (SLO: < 0.1%)."

  # Capacity Planning Alerts
  - name: mcp_capacity_planning
    rules:
      - alert: McpHighRequestRate
        expr: rate(mcb_http_requests_total[5m]) > 800
        for: 10m
        labels:
          severity: info
          service: mcb
        annotations:
          summary: "High request rate - capacity planning"
          description: "Request rate: {{ $value | printf \"%.1f\" }}/s (approaching 1000/s limit)."

      - alert: McpNotReady
        expr: mcb_ready == 0
        for: 5m
        labels:
          severity: critical
          service: mcb
        annotations:
          summary: "MCB dependencies are not ready"
          description: "At least one required MCB runtime dependency has been unusable for 5 minutes."

  # Dependency Health Alerts
  - name: mcb_dependencies
    rules:
      - alert: McpDatabaseDown
        expr: mcb_dependency_ready{dependency="database"} == 0
        for: 2m
        labels:
          severity: critical
          service: mcb
          dependency: mcb
        annotations:
          summary: "Database dependency down"
          description: "The configured MCB database is not usable."

      - alert: McpVectorStoreDown
        expr: mcb_dependency_ready{dependency="vector_store"} == 0
        for: 5m
        labels:
          severity: critical
          service: mcb
          dependency: mcb
        annotations:
          summary: "Vector store dependency down"
          description: "The configured MCB vector store is not usable."
