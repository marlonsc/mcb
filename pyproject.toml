[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "flext-cli @ git+https://github.com/flext-sh/flext-cli.git@0.12.0-dev",
  "flext-core @ git+https://github.com/flext-sh/flext-core.git@0.12.0-dev",
  "flext-infra @ git+https://github.com/flext-sh/flext-infra.git@0.12.0-dev",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "structlog>=26.1.0,<27",
]
description = "Repository-local automation helpers for MCB"
keywords = ["clean-architecture", "flext", "integration", "typed"]
license = "MIT"
name = "mcb-scripts"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.4.0"

[[project.authors]]
email = "marlonsc@gmail.com"
name = "Marlon Costa"

[[project.maintainers]]
email = "marlonsc@gmail.com"
name = "Marlon Costa"

[project.scripts]
mcb-scripts = "mcb_scripts.cli:main"

[project.urls]
Documentation = "https://github.com/marlonsc/mcb"
Homepage = "https://github.com/marlonsc/mcb"
Repository = "https://github.com/marlonsc/mcb"

[project.optional-dependencies]
gitops = [
  "hvac>=2.4.0",
  "kubernetes>=36.0.3",
  "kubernetes-validate>=1.36.0",
  "requests>=2.34.2",
  "ruamel.yaml",
]

[dependency-groups]
codegen = [
  "flext-infra @ git+https://github.com/flext-sh/flext-infra.git@0.12.0-dev",
]
dev = [
  "actionlint-py>=1.7.12.24",
  "bandit>=1.9.4",
  "code-review-graph[all]>=2.3.8",
  "deptry",
  "editables>=0.6",
  "flext-tests @ git+https://github.com/flext-sh/flext-tests.git@0.12.0-dev",
  "hypothesis",
  "mkdocs",
  "mkdocs-autorefs",
  "mkdocs-exclude>=1.0.2",
  "mkdocs-git-revision-date-localized-plugin>=1.5.4",
  "mkdocs-material>=9.7.7",
  "mkdocs-mermaid2-plugin>=1.2.3",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocs-redirects>=1.2.3",
  "mkdocs-section-index>=0.3.12",
  "mkdocstrings>=1.0.6",
  "mkdocstrings-python>=2.0.8",
  "mypy>=2.3.1",
  "platformdirs>=4.12.0",
  "pre-commit>=4.6.2",
  "pymdown-extensions",
