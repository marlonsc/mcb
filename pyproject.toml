]
project-includes = ["scripts/**/*.py*", "src/**/*.py*", "tests/**/*.py*"]
python-version = "3.13"
search-path = ["src", "."]
use-ignore-files = false

[tool.pyrefly.errors]
bad-argument-count = "error"
