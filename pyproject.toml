# @flext-managed: continuous
# @flext-regenerate: make deps WHAT=upgrade APPLY=Y
# @flext-ssot: flext-infra/src/flext_infra/_constants/deps.py
# @flext-ssot-dependencies: flext-infra/config/codegen.yaml (project_defaults.dev, dependency_profiles)
# @flext-maintenance: do not edit managed sections; edit the SSOT
# [MANAGED] FLEXT pyproject standardization
# Sections with [MANAGED] are enforced by flext_infra.deps.modernizer.
# Sections with [CUSTOM] are project-specific extension points.

# [CUSTOM] project metadata
[project]
dependencies = [
  "flext-cli @ git+https://github.com/flext-sh/flext-cli.git@0.12.0-dev",
  "flext-core @ git+https://github.com/flext-sh/flext-core.git@0.12.0-dev",
  "flext-infra @ git+https://github.com/flext-sh/flext-infra.git@0.12.0-dev",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "structlog>=26.1.0",
]
description = "Repository-local automation helpers for MCB"
name = "mcb-scripts"
requires-python = ">=3.13,<3.14"
version = "0.4.0"

# [MANAGED] consolidated development dependencies
[project.optional-dependencies]
gitops = [
  "hvac>=2.4.0",
  "kubernetes>=36.0.3",
  "kubernetes-validate>=1.36.0",
  "requests>=2.34.2",
  "ruamel.yaml",
]

# [MANAGED] build system
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# [MANAGED] codespell
[tool.codespell]
check-filenames = true
ignore-words-list = "crate,nd"

# [MANAGED] coverage
[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if _t.TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]
fail_under = 45
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.run]
omit = [
  "*/_protocols/*",
  "*/dependency_injector/providers.pyx",
  "*/protocols.py",
]
source = ["src"]

# [MANAGED] deptry
[tool.deptry]
known_first_party = [
  "flext_cli",
  "flext_core",
  "flext_infra",
  "flext_tests",
  "mcb_scripts",
]
pep621_dev_dependency_groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcb_scripts"]

[tool.hatch.metadata]
allow-direct-references = true

# [MANAGED] mypy
[tool.mypy]
# FLEXT mypy suppression rationale (validated at the facade-MRO boundary):
# FLEXT mypy[assignment]: Dependency-injector descriptors lose their MRO-bound type only in Mypy.
# FLEXT mypy[attr-defined]: PEP 562 facade members inherited through MRO are invisible to Mypy.
# FLEXT mypy[call-arg]: Pydantic v2 init signatures behind facade MRO are incomplete in Mypy.
# FLEXT mypy[misc]: Valid PEP 695 nested facade aliases are rejected under Mypy's misc bucket.
# FLEXT mypy[name-defined]: Generated PEP 562 exports are installed at runtime but absent to Mypy.
# FLEXT mypy[prop-decorator]: Mypy loses Pydantic computed-field descriptors across composed MRO.
# FLEXT mypy[valid-type]: Mypy rejects facade namespaces used as owners in valid PEP 695 aliases.
check_untyped_defs = true
disable_error_code = [
  "assignment",
  "attr-defined",
  "call-arg",
  "misc",
  "name-defined",
  "prop-decorator",
  "valid-type",
]
disallow_untyped_defs = true
explicit_package_bases = true
extra_checks = true
files = ["scripts/check", "src"]
follow_imports = "normal"
ignore_missing_imports = true
local_partial_types = true
mypy_path = ["src", "."]
namespace_packages = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
disable_error_code = ["arg-type"]
module = ["*.cli"]

[[tool.mypy.overrides]]
disable_error_code = ["unreachable"]
module = ["dcdoc._utilities._charts._matplotlib_renderer._renders_spec"]

# [MANAGED] pydantic-mypy
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# [MANAGED] pyrefly
[tool.pyrefly]
disable-project-excludes-heuristics = true
ignore-errors-in-generated-code = true
project-excludes = [
  "**/*_pb2*.py",
  "**/*_pb2_grpc*.py",
  "**/.venv/**",
  "**/__pycache__",
  "**/__pyrefly_virtual__/**",
  "**/node_modules",
  "**/site-packages/**",
  "**/typings/**",
  "**/vendor/**",
  "**/venv/**",
  ".venv/**",
  "typings/**",
  "vendor/**",
]
project-includes = ["scripts/**/*.py*", "src/**/*.py*", "tests/**/*.py*"]
python-version = "3.13"
search-path = ["src", "."]
use-ignore-files = false

[tool.pyrefly.errors]
abstract-method-call = false
bad-argument-count = "error"
bad-argument-type = "error"
bad-assignment = "error"
bad-class-definition = "error"
bad-context-manager = "error"
bad-dunder-all = "error"
