# [MANAGED] pyright
[tool.pyright]
# FLEXT Pyright suppression rationale (validated at the facade-MRO boundary):
# FLEXT pyright[reportAssignmentType]: Pyright rejects the canonical class-alias rebind after MRO facade composition although runtime and the other analyzers resolve it.
# FLEXT pyright[reportGeneralTypeIssues]: Pyright groups the same valid MRO facade alias rebind under its broad general diagnostic in every execution environment.
exclude = [
  "**/.*",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/.venv",
  "**/.venv/**",
  "**/__pycache__",
  "**/__pyrefly_virtual__/**",
  "**/dist-packages",
  "**/dist-packages/**",
  "**/node_modules",
  "**/site-packages",
  "**/site-packages/**",
  "**/tests/fixtures",
  "**/tests/fixtures/**",
  "**/venv",
  "**/venv/**",
  ".git",
  ".reports",
  ".venv",
  "vendor",
]
extraPaths = ["src", "."]
include = ["scripts", "src", "tests"]
pythonPlatform = "Linux"
pythonVersion = "3.13"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "none"
reportInconsistentConstructor = "error"
reportInvalidTypeForm = "none"
reportMissingImports = "error"
reportMissingModuleSource = "error"
reportMissingTypeStubs = "none"
reportPrivateUsage = "warning"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnreachable = "none"
reportUnsupportedDunderAll = "none"
reportUntypedBaseClass = "none"
reportUntypedFunctionDecorator = "none"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
extraPaths = [".", "src"]
reportArgumentType = "none"
reportAssignmentType = "none"
reportAttributeAccessIssue = "none"
reportGeneralTypeIssues = "none"
reportInvalidTypeForm = "none"
reportPrivateImportUsage = "none"
reportPrivateUsage = "none"
reportReturnType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnusedImport = "none"
root = "scripts"

[[tool.pyright.executionEnvironments]]
