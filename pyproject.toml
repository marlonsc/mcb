[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "flext-cli @ git+https://github.com/flext-sh/flext-cli.git@0.12.0-dev",
  "flext-core @ git+https://github.com/flext-sh/flext-core.git@0.12.0-dev",
  "flext-infra @ git+https://github.com/flext-sh/flext-infra.git@0.12.0-dev",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.14.2,<2.15",
  "structlog>=25.5.0,<27",
]
description = "Repository-local automation helpers for MCB"
keywords = ["clean-architecture", "flext", "integration", "typed"]
license = "MIT"
name = "mcb-scripts"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.4.0"

[[project.authors]]
email = "marlonsc@gmail.com"
name = "Marlon Costa"

[[project.maintainers]]
email = "marlonsc@gmail.com"
name = "Marlon Costa"

[project.scripts]
mcb-scripts = "mcb_scripts.cli:main"

[project.urls]
Documentation = "https://github.com/marlonsc/mcb"
Homepage = "https://github.com/marlonsc/mcb"
Repository = "https://github.com/marlonsc/mcb"

[project.optional-dependencies]
