[tool.codespell]
check-filenames = true
ignore-words-list = "crate,nd"

[tool.coverage.report]
exclude_also = [
  "if _t.TYPE_CHECKING:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.run]
source = ["src"]
omit = [
  "*/dependency_injector/providers.pyx",
  "*/protocols.py",
  "*/_protocols/*",
]

[tool.deptry]
known_first_party = ["flext_core", "mcb_scripts"]
pep621_dev_dependency_groups = ["dev"]

[tool.flext.docs]
package_name = "mcb_scripts"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcb_scripts"]

[tool.hatch.build.targets.wheel.force-include]
config = "mcb_scripts/config"

[tool.hatch.build.targets.sdist]
only-include = ["src/mcb_scripts", "config"]

[tool.mypy]
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "call-arg",
  "misc",
  "name-defined",
  "no-any-return",
  "no-redef",
  "prop-decorator",
  "type-var",
  "unreachable",
  "valid-type",
]
exclude = "^legado(?:/|$)"
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
python_version = "3.13"
allow_redefinition = true
check_untyped_defs = true
explicit_package_bases = true
extra_checks = true
follow_untyped_imports = true
local_partial_types = true
namespace_packages = true
no_implicit_reexport = true
show_traceback = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["rope.*"]
disable_error_code = []
follow_untyped_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-excludes = [
  "**/*_pb2*.py",
  "**/*_pb2_grpc*.py",
  "**/.venv/**",
  "**/__pycache__",
  "**/__pyrefly_virtual__/**",
