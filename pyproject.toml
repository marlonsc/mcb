# [MANAGED] pytest
[tool.pytest.ini_options]
addopts = [
  "--benchmark-disable",
  "--durations=10",
  "--markdown-docs",
  "--strict-markers",
  "--timeout=10",
]
filterwarnings = [
  "error",
  "module::flext_core._constants.enforcement.FlextMroViolation",
]
markers = [
  "docker: tests requiring Docker",
  "e2e: end-to-end integration tests",
  "edge_cases: edge case tests",
  "integration: integration tests",
  "performance: performance and benchmark tests",
  "remote: tests requiring remote/external network services",
  "resilience: resilience tests",
  "slow: slow-running tests",
  "smoke: public-interface smoke tests",
  "stress: stress tests",
  "timeout: per-test timeout override (pytest-timeout)",
  "unit: unit tests",
]
minversion = "8.0"
python_classes = ["Test*"]
python_files = ["*_test.py", "*_tests.py", "test_*.py"]
pythonpath = ["src"]
testpaths = [".", "docs", "examples", "scripts", "src", "tests"]

# [MANAGED] ruff
[tool.ruff]
exclude = [
  "**/.archive/**",
  "**/__pyrefly_virtual__/**",
  ".archive",
  ".archive/**",
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "archive",
  "backup",
  "build",
  "dist",
  "htmlcov",
  "temp-backup",
  "typings",
  "vendor",
  "venv",
]
fix = false
line-length = 88
namespace-packages = ["examples", "scripts", "tests"]
preview = true
respect-gitignore = true
show-fixes = true
src = ["examples", "scripts", "src", "tests"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = true

[tool.ruff.lint]
# FLEXT Ruff suppression rationale (validated against semantic facet order):
# FLEXT ruff[import-outside-top-level]: Public facade models are imported lazily only at validation and construction sites to preserve the c-t-p-m-u graph and prevent runtime cycles.
# FLEXT ruff[unsorted-imports]: Ruff sorts TYPE_CHECKING imports lexically and reverses the mandatory semantic c-t-p-m-u dependency order in FLEXT facades.
ignore = [
  "ambiguous-unicode-character-comment",
  "ambiguous-unicode-character-docstring",
  "ambiguous-unicode-character-string",
  "boolean-positional-value-in-call",
  "camelcase-imported-as-lowercase",
  "complex-structure",
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "import-outside-top-level",
  "incorrect-blank-line-before-class",
  "line-too-long",
  "logging-f-string",
  "missing-copyright-notice",
  "missing-trailing-comma",
  "multi-line-summary-second-line",
  "no-self-use",
  "non-imperative-mood",
  "too-many-arguments",
  "too-many-branches",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-return-statements",
  "too-many-statements",
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "typing-only-third-party-import",
  "unsorted-imports",
]
select = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api.argparse]
msg = "Use cli.register_result_command + Pydantic model from flext_cli."

[tool.ruff.lint.flake8-tidy-imports.banned-api.click]
msg = "Use flext_cli.cli application, registration, execution, and invocation methods."

[tool.ruff.lint.flake8-tidy-imports.banned-api.rich]
msg = "Use cli.print / cli.display_message / cli.render_panel / cli.render_table."

[tool.ruff.lint.flake8-tidy-imports.banned-api.typer]
msg = "Use cli.create_app_with_common_params / cli.register_command from flext_cli."

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = [
  "flext_cli",
  "flext_core",
  "flext_infra",
  "flext_tests",
  "mcb_scripts",
]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/.vulture_whitelist.py" = ["ALL"]
"**/*_pb2*.py" = ["ALL"]
"scripts/cmd/**/*.py" = ["invalid-module-name", "shebang-not-executable"]
"**/examples/**/*.py" = ["invalid-module-name", "shebang-not-executable"]
"**/tests/**" = [
  "assert",
  "compare-to-empty-string",
  "magic-value-comparison",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-method",
]
"**/__init__.py" = [
  "any-type",
  "builtin-import-shadowing",
  "implicit-namespace-package",
  "import-private-name",
  "invalid-module-name",
  "non-empty-init-module",
  "runtime-import-in-type-checking-block",
  "undefined-export",
  "undefined-local-with-import-star",
  "undefined-local-with-import-star-usage",
  "undocumented-public-init",
  "unused-import",
]
