  "types-tabulate>=0.10.0.20260508",
  "types-toml>=0.10.8.20260518",
  "vulture>=2.16",
  "yamlfix>=1.19.1",
]

[tool.codespell]
check-filenames = true
ignore-words-list = "crate,nd"

[tool.coverage.report]
exclude_also = [
  "if _t.TYPE_CHECKING:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.run]
source = ["src"]
omit = [
  "*/dependency_injector/providers.pyx",
  "*/protocols.py",
  "*/_protocols/*",
]

[tool.deptry]
known_first_party = ["flext_core", "mcb_scripts"]
pep621_dev_dependency_groups = ["dev"]

[tool.flext.docs]
package_name = "mcb_scripts"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = ["/src/mcb_scripts/**"]

[tool.hatch.build.targets.wheel.sources]
"src/mcb_scripts" = "mcb_scripts"

[tool.hatch.build.targets.sdist]
include = ["/src/mcb_scripts/**"]

[tool.mypy]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
python_version = "3.13"
allow_redefinition = true
check_untyped_defs = true
explicit_package_bases = true
extra_checks = true
follow_untyped_imports = true
local_partial_types = true
namespace_packages = true
no_implicit_reexport = true
show_traceback = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["rope.*"]
follow_untyped_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-excludes = [
  "**/*_pb2*.py",
  "**/*_pb2_grpc*.py",
  "**/.venv/**",
  "**/__pycache__",
  "**/__pyrefly_virtual__/**",
  "**/node_modules",
  "**/site-packages/**",
  "**/typings/**",
  "**/vendor/**",
  "**/venv/**",
  ".venv/**",
  "typings/**",
  "vendor/**",
]
project-includes = ["scripts/**/*.py*", "src/**/*.py*", "tests/**/*.py*"]
python-version = "3.13"
search-path = ["src", "."]
use-ignore-files = false

[tool.pyrefly.errors]
bad-argument-count = "error"
bad-argument-type = "error"
bad-assignment = "error"
bad-class-definition = "error"
bad-context-manager = "error"
bad-dunder-all = "error"
bad-function-definition = "error"
bad-index = "error"
bad-instantiation = "error"
bad-keyword-argument = "error"
bad-match = "error"
bad-param-name-override = "error"
bad-raise = "error"
bad-return = "error"
bad-specialization = "error"
bad-typed-dict = "error"
bad-typed-dict-key = "error"
bad-unpacking = "error"
deprecated = "error"
implicit-abstract-class = "error"
implicit-any = "error"
implicit-import = "error"
implicitly-defined-attribute = "error"
inconsistent-inheritance = "error"
inconsistent-overload = "error"
inconsistent-overload-default = "error"
invalid-annotation = "error"
invalid-argument = "error"
invalid-decorator = "error"
invalid-inheritance = "error"
invalid-literal = "error"
invalid-overload = "error"
invalid-param-spec = "error"
invalid-pattern = "error"
invalid-self-type = "error"
invalid-super-call = "error"
invalid-type-alias = "error"
invalid-type-var = "error"
invalid-type-var-tuple = "error"
invalid-variance = "error"
invalid-yield = "error"
missing-argument = "error"
missing-attribute = "error"
missing-import = "error"
missing-module-attribute = "error"
missing-override-decorator = "error"
missing-source = "error"
missing-source-for-stubs = "error"
no-access = "error"
no-matching-overload = "error"
not-a-type = "error"
not-async = "error"
not-callable = "error"
not-iterable = "error"
not-required-key-access = "error"
open-unpacking = "error"
protocol-implicitly-defined-attribute = "error"
read-only = "error"
redefinition = "error"
redundant-cast = "error"
redundant-condition = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unbound-name = "error"
unexpected-keyword = "error"
unexpected-positional-argument = "error"
unknown-name = "error"
unnecessary-comparison = "error"
unnecessary-type-conversion = "error"
unreachable = "error"
unresolvable-dunder-all = "error"
unsafe-overlap = "error"
unsupported = "error"
unsupported-delete = "error"
unsupported-operation = "error"
untyped-import = "error"
unused-coroutine = "error"
unused-ignore = "error"
variance-mismatch = "error"

[tool.pyright]
exclude = [
  "**/.*",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/.venv",
  "**/.venv/**",
  "**/__pycache__",
  "**/__pyrefly_virtual__/**",
  "**/dist-packages",
  "**/dist-packages/**",
  "**/node_modules",
  "**/site-packages",
  "**/site-packages/**",
  "**/venv",
  "**/venv/**",
  ".git",
  ".reports",
  ".venv",
  "vendor",
]
include = ["src", "tests"]
extraPaths = ["src", "."]
pythonPlatform = "Linux"
pythonVersion = "3.13"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportInconsistentConstructor = "error"
reportMissingImports = "error"
reportMissingModuleSource = "error"
reportPrivateUsage = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryIsInstance = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "src"
extraPaths = ["src"]
reportPrivateUsage = "error"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src"]
reportPrivateUsage = "error"

[tool.pytest.ini_options]
addopts = [
  "--benchmark-disable",
  "--strict-markers",
  "--markdown-docs",
  "--durations=10",
  "--timeout=10",
]
flext_slow_timeout_seconds = "30"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  "module::flext_core._constants.enforcement.FlextMroViolation",
]
markers = [
  "smoke: public-interface smoke tests",
  "unit: unit tests",
  "integration: integration tests",
  "functional: functional behavior tests",
  "performance: performance and benchmark tests",
  "slow: slow-running tests",
  "docker: tests requiring Docker",
  "oracle: tests requiring the shared Oracle database",
  "remote: tests requiring remote/external network services",
  "e2e: end-to-end integration tests",
  "edge_cases: edge case tests",
  "stress: stress tests",
  "resilience: resilience tests",
  "discovery: catalog and stream discovery tests",
  "singer: Singer protocol contract tests",
]
minversion = "8.0"
python_classes = ["Test*"]
python_files = ["*_test.py", "*_tests.py", "test_*.py"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = []
fix = false
line-length = 88
namespace-packages = ["tests", "examples", "scripts"]
preview = true
respect-gitignore = true
show-fixes = true
src = ["scripts", "src", "tests"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
extend-safe-fixes = ["camelcase-imported-as-lowercase", "relative-imports"]
ignore = [
  "camelcase-imported-as-lowercase",
  "implicit-namespace-package",
  "missing-required-import",
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "typing-only-third-party-import",
]
select = ["ALL"]
unfixable = [
  "duplicate-value",
  "multi-value-repeated-key-literal",
  "multi-value-repeated-key-variable",
  "outdated-version-block",
  "p-print",
  "print",
  "pytest-duplicate-parametrize-test-cases",
  "redefined-while-unused",
  "unused-variable",
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "Copyright \\(c\\) \\d{4} \\S[^\\n]*\\. All rights reserved\\."

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api.argparse]
msg = "Use cli.register_result_command + Pydantic model from flext_cli."

[tool.ruff.lint.flake8-tidy-imports.banned-api.click]
msg = "Use flext_cli.cli application, registration, execution, and invocation methods."

[tool.ruff.lint.flake8-tidy-imports.banned-api.rich]
msg = "Use cli.print / cli.display_message / cli.render_panel / cli.render_table."

[tool.ruff.lint.flake8-tidy-imports.banned-api.tabulate]
msg = "Use cli.render_table from flext_cli."

[tool.ruff.lint.flake8-tidy-imports.banned-api.typer]
msg = "Use cli.create_app_with_common_params / cli.register_command from flext_cli."

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["flext_core", "mcb_scripts"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
  "non-empty-init-module",
  "runtime-import-in-type-checking-block",
  "typing-only-first-party-import",
  "unused-import",
]
"**/tests/python/**" = [
  "raise-vanilla-args",
  "start-process-with-partial-path",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
"scripts/**" = [
  "any-type",
  "avoidable-escaped-quote",
  "banned-api",
  "blank-line-after-function",
  "boolean-default-value-positional-argument",
  "boolean-type-hint-positional-argument",
  "builtin-open",
  "commented-out-code",
  "error-instead-of-exception",
  "f-string-in-exception",
  "if-exp-instead-of-or-operator",
  "import-private-name",
  "invalid-module-name",
  "literal-membership",
  "logging-string-concat",
  "magic-value-comparison",
  "manual-list-comprehension",
  "manual-list-copy",
  "missing-blank-line-after-summary",
  "missing-maxsplit-arg",
  "multi-line-summary-first-line",
  "multiple-starts-ends-with",
  "non-lowercase-variable-in-function",
  "noqa-comments",
  "os-path-abspath",
  "os-path-dirname",
  "os-path-exists",
  "os-path-join",
  "path-constructor-current-directory",
  "print",
  "raise-vanilla-args",
  "raw-string-in-exception",
  "read-whole-file",
  "relative-imports",
  "repeated-append",
  "runtime-cast-value",
  "shebang-not-executable",
  "start-process-with-partial-path",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "unnecessary-multiline-docstring",
  "unsorted-dunder-all",
  "unspecified-encoding",
  "unused-function-argument",
  "unused-noqa",
  "used-dummy-variable",
  "verbose-raise",
  "write-whole-file",
]
"scripts/**/*.py" = [
  "commented-out-code",
  "line-too-long",
  "typing-only-first-party-import",
]
"tests/**/*.py" = ["assert"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tomlsort]
all = true
in_place = true
sort_first = ["project", "build-system", "tool", "dependency-groups"]

[tool.vulture]
exclude = ["*/_protocols/*"]
min_confidence = 100
paths = ["src"]
verbose = false

[tool.yamlfix]
explicit_start = false
line_length = 88
preserve_quotes = true
section_whitelines = 1
whitelines = 1

[tool.uv]
link-mode = "copy"
constraint-dependencies = ["mypy<2.4.0"]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
